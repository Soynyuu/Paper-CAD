<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Top Face Gradient (Light Orange to Vivid Orange) -->
    <linearGradient id="topFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Left Face Gradient (Warm Orange to Deep Orange) -->
    <linearGradient id="leftFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Right Face Gradient (Amber to Burnt Orange) -->
    <linearGradient id="rightFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Glue Tab Gradient (Light Slate Semi-Transparent) -->
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Dark Base/Background Squircle for high contrast on all themes -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0f172a" stroke="#1e293b" stroke-width="8" />

  <!-- Grid Pattern in background to enhance the "CAD" theme -->
  <g opacity="0.15">
    <line x1="80" y1="16" x2="80" y2="496" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="144" y1="16" x2="144" y2="496" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="208" y1="16" x2="208" y2="496" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="272" y1="16" x2="272" y2="496" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="336" y1="16" x2="336" y2="496" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="400" y1="16" x2="400" y2="496" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="464" y1="16" x2="464" y2="496" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />

    <line x1="16" y1="80" x2="496" y2="80" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="16" y1="144" x2="496" y2="144" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="16" y1="208" x2="496" y2="208" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="16" y1="272" x2="496" y2="272" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="16" y1="336" x2="496" y2="336" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="16" y1="400" x2="496" y2="400" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="16" y1="464" x2="496" y2="464" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8" />
  </g>

  <!-- 3D Unfolding Cube Group -->
  <g transform="translate(0, 10)">
    <!-- Glue Tabs (Papercraft Elements) -->
    <!-- Tab 1: Top-Left edge of Top face -->
    <polygon points="135,170 120,150 235,80 256,100" fill="url(#tabGrad)" stroke="#475569" stroke-width="3" stroke-dasharray="6 4" stroke-linejoin="round" />

    <!-- Tab 2: Top-Right edge of Top face -->
    <polygon points="256,100 277,80 392,150 377,170" fill="url(#tabGrad)" stroke="#475569" stroke-width="3" stroke-dasharray="6 4" stroke-linejoin="round" />

    <!-- Tab 3: Bottom-Right edge of Right face -->
    <polygon points="377,310 392,330 277,400 256,380" fill="url(#tabGrad)" stroke="#475569" stroke-width="3" stroke-dasharray="6 4" stroke-linejoin="round" />

    <!-- Isometric Faces with glowing borders -->
    <!-- Left Face -->
    <polygon points="135,170 256,240 256,380 135,310" fill="url(#leftFaceGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

    <!-- Right Face -->
    <polygon points="256,240 377,170 377,310 256,380" fill="url(#rightFaceGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

    <!-- Top Face -->
    <polygon points="256,100 377,170 256,240 135,170" fill="url(#topFaceGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />

    <!-- Dashed Fold Lines (Interior Shared Edges) -->
    <line x1="256" y1="240" x2="256" y2="100" stroke="#f8fafc" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" />
    <line x1="256" y1="240" x2="135" y2="170" stroke="#f8fafc" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" />
    <line x1="256" y1="240" x2="377" y2="170" stroke="#f8fafc" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" />
    <line x1="256" y1="240" x2="256" y2="380" stroke="#f8fafc" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" />

    <!-- CAD Vertex Nodes (Glowing Orange Anchors) -->
    <circle cx="256" cy="100" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="135" cy="170" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="377" cy="170" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="256" cy="240" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="135" cy="310" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="377" cy="310" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="256" cy="380" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="2.5" />

    <!-- Subtly indicate an unfolding action or dimensional label -->
    <!-- Dimension line: distance along the left edge -->
    <g opacity="0.8">
      <!-- Extension lines -->
      <line x1="135" y1="170" x2="95" y2="170" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="135" y1="310" x2="95" y2="310" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Dimension line itself -->
      <line x1="105" y1="175" x2="105" y2="305" stroke="#fb923c" stroke-width="2" />
      <!-- Dimension arrows -->
      <line x1="100" y1="180" x2="110" y2="170" stroke="#fb923c" stroke-width="2" />
      <line x1="100" y1="315" x2="110" y2="305" stroke="#fb923c" stroke-width="2" />
    </g>
  </g>
</svg>
